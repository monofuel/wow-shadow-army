name: Tests

# Unit + pin CI. One job per independent leg (lua / nim / pin) so the wall
# clock is the slowest leg, not the sum, and a dep problem in one language
# cannot hide a unit failure in another. Pin check needs the private
# Monolab/coworld-vanilla-wow mirror at the upstream.lock pin as a sibling
# path (see docs/testing.md). House styles: crewrift-prime-bots test.yml
# (apt lua) + Racha build.yml (setup-nim-action + nimby.lock + cache).
# Testing doctrine: racha_notes Programming/testing.md.

on:
  push:
  workflow_dispatch:

jobs:
  # Lua leg: unit suites + parse smoke. Explicit lua-only targets — the
  # builder image carries a dep-less nim, so `make test` here would run the
  # nim tier without its packages and fail for the wrong reason.
  lua-tests:
    runs-on: monolab-builder
    steps:
      - uses: actions/checkout@v3
      - name: Install lua 5.3
        run: |
          apt-get update
          apt-get install -y lua5.3
      - name: Lua unit suite + parse smoke
        run: make test-lua test-smoke-lua

  # Nim leg: unit suites + compile smoke, deps pinned by nimby.lock. Same
  # global profile as local dev (playbooks/pull-upstream.md in wow-coworld):
  # NIMBY_HOME is its own Nimby workspace outside the checkout, `nimby sync -g`
  # installs into $NIMBY_HOME/pkgs and writes their paths to $NIMBY_HOME/nim.cfg,
  # which config.nims reads. Never workspace-mode sync. Cache keyed on the
  # army lock and the fork pin, whose locks together make up the profile.
  # nim.cfg imports two sibling sources, checked out here at fixed commits:
  # the client fork (../monofuel-vanilla-wow: environment/, coworld_wow_sdk/)
  # and scriptorium (../scriptorium/src: the conductor's library). The fork's
  # lock fetches private Wololo from the private Monolab/wololo Gitea mirror.
  nim-tests:
    runs-on: monolab-builder
    env:
      FORK_PIN: 141a3fe249c4f1437b34336b2ad84396061e4594
      SCRIPTORIUM_PIN: 565d6a84742e21f47374056db7be67589af72982
    steps:
      - uses: actions/checkout@v3
      - name: Checkout sibling sources at pin
        env:
          # Same read-only deploy key as pin-check: the fork's commits live
          # on the private Monolab/coworld-vanilla-wow mirror. Scriptorium
          # is public on GitHub and needs no credentials.
          CI_DEPLOY_KEY: ${{ secrets.CI_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$CI_DEPLOY_KEY" ]; then
            echo "error: org secret CI_DEPLOY_KEY missing (read-only deploy key for the private mirrors)" >&2
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$CI_DEPLOY_KEY" > ~/.ssh/ci_deploy_key
          chmod 600 ~/.ssh/ci_deploy_key
          PARENT="$(dirname "$GITHUB_WORKSPACE")"
          checkout_pin() {
            dir="$1"; url="$2"; pin="$3"; branch="$4"
            rm -rf "$dir"
            git init -q "$dir"
            git -C "$dir" remote add origin "$url"
            if ! git -C "$dir" fetch --depth 1 origin "$pin"; then
              echo "direct pin fetch failed — fetching $branch then checkout"
              git -C "$dir" fetch origin "$branch"
            fi
            git -C "$dir" checkout -q --force "$pin"
            echo "$dir HEAD=$(git -C "$dir" rev-parse HEAD)"
          }
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/ci_deploy_key -o StrictHostKeyChecking=accept-new"
          checkout_pin "$PARENT/monofuel-vanilla-wow" \
            "ssh://git@10.11.4.11:222/Monolab/coworld-vanilla-wow.git" \
            "$FORK_PIN" monofuel/master
          checkout_pin "$PARENT/scriptorium" \
            "https://github.com/monofuel/scriptorium.git" \
            "$SCRIPTORIUM_PIN" master
      # treeform/setup-nim-action ships nim + nimby directly (Racha pattern);
      # Tooling CI stays on 2.2.4; the native player follows its Dockerfile pin.
      - uses: treeform/setup-nim-action@v6
        with:
          nim-version: '2.2.4'
      # Absolute path, persisted for later steps: config.nims does not expand ~.
      - name: Select the wow-coworld Nimby profile
        run: echo "NIMBY_HOME=$HOME/.nimby/profiles/wow-coworld" >> "$GITHUB_ENV"
      - name: Cache nim packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.nimble
            ~/.nimby
          key: ${{ runner.os }}-nimby-v1-${{ hashFiles('nimby.lock') }}-${{ env.FORK_PIN }}
          restore-keys: |
            ${{ runner.os }}-nimby-v1-
      # Nimby refuses to create a workspace inside a Git checkout, so the
      # profile directory is created as one explicitly (no-op when cached).
      # The fork's lock, then the army's: both `-g` syncs append to one
      # profile, whose union is what the fork modules and army code import.
      # The fork's lock pins Wololo (private Softmax code) to the private
      # Monolab/wololo Gitea mirror. WOLOLO_CI_READ_KEY is a repository secret
      # holding a read-only key registered only on that mirror, separate from
      # CI_DEPLOY_KEY. It exists only in this step, in a private temp dir that
      # is removed on exit, and SSH trusts only the pinned Gitea host key. The
      # ls-remote preflight proves the key reads the pin even when the package
      # cache already holds Wololo and Nimby has nothing to fetch.
      - name: Sync deps from locks
        env:
          WOLOLO_CI_READ_KEY: ${{ secrets.WOLOLO_CI_READ_KEY }}
          WOLOLO_KEY_FINGERPRINT: 'SHA256:6eLEF7HguEb9P74Yf9PyuC1LNMXQ9xhIUGtmyMuMi10'
          WOLOLO_URL: 'ssh://git@10.11.4.11:222/Monolab/wololo.git'
          WOLOLO_PIN: 86aa2a6379bf352a18a4d717e1b5da63451e75c0
          WOLOLO_PIN_TAG: refs/tags/ci-wow-coworld-pin-86aa2a6379bf352a18a4d717e1b5da63451e75c0
          GITEA_HOST_KEY: '[10.11.4.11]:222 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIB909FOcZXflNQ6j+A9yJRYdYQ/AVelTjZ+QfQVW6XyU'
        run: |
          set -euo pipefail
          set +x
          if [ -z "${WOLOLO_CI_READ_KEY:-}" ]; then
            echo "error: repository secret WOLOLO_CI_READ_KEY missing (read-only key for the private Monolab/wololo mirror)" >&2
            exit 1
          fi
          ssh_dir="$(mktemp -d "${RUNNER_TEMP:-/tmp}/wololo-ssh.XXXXXX")"
          trap 'rm -rf "$ssh_dir"' EXIT
          trap 'exit 1' HUP INT TERM
          chmod 700 "$ssh_dir"
          (umask 077; printf '%s\n' "$WOLOLO_CI_READ_KEY" > "$ssh_dir/wololo_read_key")
          unset WOLOLO_CI_READ_KEY
          chmod 600 "$ssh_dir/wololo_read_key"
          printf '%s\n' "$GITEA_HOST_KEY" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/known_hosts"
          ssh-keygen -y -P '' -f "$ssh_dir/wololo_read_key" > "$ssh_dir/wololo_read_key.pub"
          key_fingerprint="$(ssh-keygen -l -E sha256 -f "$ssh_dir/wololo_read_key.pub" | awk '{print $2}')"
          if [ "$key_fingerprint" != "$WOLOLO_KEY_FINGERPRINT" ]; then
            echo "error: WOLOLO_CI_READ_KEY fingerprint $key_fingerprint is not the expected $WOLOLO_KEY_FINGERPRINT" >&2
            exit 1
          fi
          export GIT_SSH_COMMAND="ssh -F /dev/null -i $ssh_dir/wololo_read_key -o IdentityAgent=none -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$ssh_dir/known_hosts -o GlobalKnownHostsFile=/dev/null"
          pin_tag_sha="$(git ls-remote --exit-code "$WOLOLO_URL" "$WOLOLO_PIN_TAG" | awk '{print $1}')"
          if [ "$pin_tag_sha" != "$WOLOLO_PIN" ]; then
            echo "error: $WOLOLO_PIN_TAG on the Wololo mirror is '$pin_tag_sha', expected $WOLOLO_PIN" >&2
            exit 1
          fi
          echo "Wololo mirror read OK: $WOLOLO_PIN_TAG = $pin_tag_sha (key $key_fingerprint)"
          mkdir -p "$NIMBY_HOME"
          cd "$NIMBY_HOME"
          nimby create
          nimby sync -g "$(dirname "$GITHUB_WORKSPACE")/monofuel-vanilla-wow/nimby.lock"
          nimby sync -g "$GITHUB_WORKSPACE/nimby.lock"
      - name: Nim unit suite + compile smoke
        run: |
          set -euo pipefail
          # Isolate our compiler/test scratch and remove only what this job
          # created. This does not add capacity when /tmp and checkout share
          # a backing filesystem; report the actual namespace/headroom.
          echo '[ci scratch] before directory creation'
          df -P -B1 /tmp "$GITHUB_WORKSPACE" "$HOME" || true
          df -Pi /tmp "$GITHUB_WORKSPACE" "$HOME" || true
          scratch="$(mktemp -d "$GITHUB_WORKSPACE/.ci-nim-tmp.XXXXXXXX")"
          report_disk() {
            echo "[ci scratch] $1"
            df -P -B1 /tmp "$scratch" "$HOME" || true
            df -Pi /tmp "$scratch" "$HOME" || true
            if command -v findmnt >/dev/null 2>&1; then
              findmnt -n -o TARGET,SOURCE,FSTYPE,SIZE,AVAIL -T "$scratch" || true
            fi
            du -sk "$scratch" "$HOME/.cache/nim" 2>/dev/null || true
          }
          cleanup() {
            status=$?
            report_disk "exit=$status"
            case "$scratch" in
              "$GITHUB_WORKSPACE"/.ci-nim-tmp.*) find "$scratch" -xdev -depth -delete ;;
              *) exit 1 ;;
            esac
            exit "$status"
          }
          trap cleanup EXIT
          trap 'exit 1' HUP INT TERM
          chmod 700 "$scratch"
          export TMPDIR="$scratch"
          export WSA_CI_SCRATCH_DIAGNOSTICS=1
          report_disk before
          make test-nim test-smoke-nim

  # Pin drift only (pure shell pin-check). No docker, no realm, no Python.
  # Needs the private mirror checkout as a sibling path.
  pin-check:
    runs-on: monolab-builder
    steps:
      - uses: actions/checkout@v3

      - name: Checkout upstream mirror at pin
        env:
          # CI_DEPLOY_KEY (Monolab org secret): read-only deploy key installed
          # on Monolab/coworld-vanilla-wow and Monolab/wow-classic-data.
          # GITHUB_TOKEN is repo-scoped and cannot read other private repos.
          CI_DEPLOY_KEY: ${{ secrets.CI_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$CI_DEPLOY_KEY" ]; then
            echo "error: org secret CI_DEPLOY_KEY missing (read-only deploy key for the private mirrors)" >&2
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$CI_DEPLOY_KEY" > ~/.ssh/ci_deploy_key
          chmod 600 ~/.ssh/ci_deploy_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/ci_deploy_key -o StrictHostKeyChecking=accept-new"
          PIN="$(awk '{print $2; exit}' upstream.lock)"
          if [ -z "$PIN" ]; then
            echo "error: could not parse SHA from upstream.lock" >&2
            exit 1
          fi
          # Sibling of GITHUB_WORKSPACE so ../coworld-vanilla-wow resolves
          # for Makefile UPSTREAM (pin-check).
          SIBLING="$(dirname "$GITHUB_WORKSPACE")/coworld-vanilla-wow"
          MIRROR_URL="ssh://git@10.11.4.11:222/Monolab/coworld-vanilla-wow.git"
          echo "[integration] cloning mirror → $SIBLING @ $PIN"
          rm -rf "$SIBLING"
          mkdir -p "$SIBLING"
          git -C "$SIBLING" init -q
          git -C "$SIBLING" remote add origin "$MIRROR_URL"
          # Fetch the pin SHA (not floating main). Depth-1 is enough for pin-check
          # + uv project files; blob filter keeps the transfer small.
          if ! git -C "$SIBLING" fetch --depth 1 --filter=blob:none origin "$PIN"; then
            echo "[integration] direct pin fetch failed — fetching main then checkout"
            git -C "$SIBLING" fetch --depth 50 --filter=blob:none origin main
            git -C "$SIBLING" checkout --force "$PIN"
          else
            git -C "$SIBLING" checkout --force FETCH_HEAD
          fi
          echo "[integration] mirror HEAD=$(git -C "$SIBLING" rev-parse HEAD)"

      - name: Pin check
        run: make pin-check
