daemon off;
pid /home/monofuel/.coworld/player/launcher_units/807bb7706ad7/nginx-assets-25608.pid;
error_log stderr notice;

# macOS launches nginx with a 256-descriptor soft limit; without this
# override the worker cannot honor worker_connections, and model/texture
# fetch bursts get connection-refused. Refused model fetches left streamed
# doodads (e.g. the Valley of Trials sign post) invisible for minutes while
# the client retried. The hard limit is unlimited, so the worker may raise
# its own soft limit.
worker_rlimit_nofile 16384;

events {
  # Browser startup can burst hundreds of small asset requests while terrain,
  # WMO groups, collision files, DBCs, and BLP textures stream in parallel.
  worker_connections 8192;
}

http {
  access_log off;
  default_type application/octet-stream;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 30;
  gzip on;
  gzip_types text/plain application/json application/x-tar;
  gzip_min_length 1024;
  gzip_comp_level 5;
  gzip_vary on;

  types {
    text/html html;
    text/plain txt;
    text/css css;
    application/javascript js mjs;
    application/wasm wasm;
    application/json json;
    application/x-tar tar;
    image/png png;
    image/jpeg jpg jpeg;
    image/gif gif;
    image/svg+xml svg;
    application/octet-stream data ktx2 dbc blp m2 wmo wdt wdl adt;
    audio/mpeg mp3;
    audio/ogg ogg;
    audio/wav wav;
  }

  server {
    listen 127.0.0.1:25608;
    server_name localhost;

    # PUBLIC BROWSER FILE POLICY.
    #
    # Only two folders may ever be served by this nginx config:
    #   1. player/dist/ through /dist/.
    #   2. player/assets/ through /assets/.
    #
    # Do not add player/tmp/, tmp/client_assets/, extracted caches, MPQ scratch
    # folders, or any other fallback path here. Browser-visible assets must be
    # staged by the owning lifecycle and composed into player/assets/ before
    # nginx serves them. Serving tmp hides converter bugs, makes the browser depend on
    # scratch state, and can accidentally expose files that are not deployable.
    #
    # If the browser needs a file, fix convert_all so it writes that file under
    # player/assets/. Be very suspicious of any new location block that serves a
    # third folder.

    location = /dist {
      return 301 /dist/;
    }

    location /dist/ {
      alias dist/;
      add_header Cache-Control "no-cache" always;
      add_header Service-Worker-Allowed "/" always;
    }

    location = /favicon.ico {
      # The wasm player page ships no favicon; keep browser consoles clean.
      return 204;
    }

    location /assets/ {
      alias assets/;
      # This origin already reads the durable hardlinked checkout tree. Do not
      # create a second browser-disk copy; local clients fetch it directly.
      add_header Cache-Control "no-store" always;
      add_header Access-Control-Allow-Origin "*" always;
      add_header Cross-Origin-Resource-Policy cross-origin always;
    }

    location / {
      return 404;
    }
  }
}
