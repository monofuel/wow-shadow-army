# wow-shadow-army — Nim paths for The System (and future Nim code).
# Softmax parent nim.cfg already supplies mummy/jsony/zippy/webby/crunchy
# as workspace siblings. MCPort + nimponents live in nimby pkgs (not Softmax
# workspace clones). Do NOT run plain `nimby sync` from this repo — workspace
# mode mutates sibling checkouts under Softmax/. The lock-based form
# (`nimby sync -g nimby.lock`, used by CI) is safe: it only installs the
# pinned packages into ~/.nimby/pkgs — the fallback paths below.
--noNimblePath

# MCPort (MCP server library)
--path:"$home/.nimby/pkgs/MCPort/src"

# nimponents (available for future web components; roster is SSR + htmx)
--path:"$home/.nimby/pkgs/nimponents/src"

# Prefer Softmax workspace copies when present (parent walk also finds these).
--path:"../mummy/src"
--path:"../jsony/src"
--path:"../zippy/src"
--path:"../webby/src"
--path:"../crunchy/src"
--path:"../nimsimd/src"

# Fallback: nimby pkgs if workspace siblings are missing.
--path:"$home/.nimby/pkgs/mummy/src"
--path:"$home/.nimby/pkgs/jsony/src"
--path:"$home/.nimby/pkgs/zippy/src"
--path:"$home/.nimby/pkgs/webby/src"
--path:"$home/.nimby/pkgs/crunchy/src"
--path:"$home/.nimby/pkgs/nimsimd/src"

# coworld-vanilla-wow-fork — nim client checkout we customize (client only).
# Same path root the fork's config.nims sets: import environment/client/...
# Stock upstream checkout stays ../coworld-vanilla-wow (read-only).
--path:"../coworld-vanilla-wow-fork"

# Product Nim tools under src/ (map_browser, …).
--path:"src"
--path:"/home/monofuel/.nimby/pkgs/webby/src"
--path:"/home/monofuel/.nimby/pkgs/jsony/src"
--path:"/home/monofuel/.nimby/pkgs/mummy/src"
--path:"/home/monofuel/.nimby/pkgs/zippy/src"
--path:"/home/monofuel/.nimby/pkgs/crunchy/src"
--path:"/home/monofuel/.nimby/pkgs/nimponents/src"
--path:"/home/monofuel/.nimby/pkgs/nimsimd/src"
--path:"/home/monofuel/.nimby/pkgs/MCPort/src"
