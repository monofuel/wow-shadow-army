
# wow-shadow-army — Nim paths for The System and the other Nim tools.
# Package paths come from the Nimby-generated config of the wow-coworld global
# profile; config.nims links it (see playbooks/pull-upstream.md in the
# wow-coworld monorepo). Never run plain `nimby sync` here.
--noNimblePath

# monofuel-vanilla-wow — the client fork we customize (client only).
# Same path root the fork's config.nims sets: import environment/client/...
# Stock upstream checkout stays ../coworld-vanilla-wow (read-only).
--path:"../monofuel-vanilla-wow"

# Product Nim tools under src/ (map_browser, conductor, …).
--path:"src"

# scriptorium — agent-orchestration library the conductor imports
# (sibling checkout / submodule of the wow-coworld monorepo). Import as
# `scriptorium/<module>` (agent_runner, git_ops, config, …).
--path:"../scriptorium/src"

# Fork renderer: opengl package injects GLerror in debug; coworld's contract is
# raises:[] (see the fork's config.nims). Required for 3D viewer.
--define:noAutoGLerrorCheck
